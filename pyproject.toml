[project]
name = "ai-infra-simulator"
version = "0.1.0"
description = "Python simulations for AI infrastructure"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "simpy>=4.1,<5",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
    "networkx>=3.2,<4",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
